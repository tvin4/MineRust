# Example server configuration. Copy this file to `server.toml` (gitignored)
# and fill in the values from YOUR copy of the game: the protocol version
# number and version name live in `version.json` inside the client jar, and
# `client_jar` points at that same jar — registries and tags are read from
# `data/minecraft/` inside it at startup. See ARCHITECTURE.md section 5.
# Do not commit real values to the repository.

listen = "0.0.0.0:25565"
# Matches the vanilla `motd` (server.properties) so the status parity test
# compares like with like; view/simulation distance in the code are 10 as
# in the vanilla defaults.
motd = "A Minecraft Server"
max_players = 20

# Path to the client jar of your game installation.
client_jar = "path/to/client.jar"

# Optional: reports/packets.json generated from your game copy with
# `tools\generate-reports.ps1`. When set, every packet id is taken from
# that report and verified at startup; when omitted the compiled defaults
# (documented, unverified) are used and the server logs a warning.
# packets_report = "path/to/generated/reports/packets.json"

# Optional: reports/registries.json generated from your game copy with
# `tools\generate-reports.ps1`. When set, the numeric ids of the built-in
# registries (block, item, potion, ...) come from that report and their
# tags are sent during configuration; when omitted only the synchronized
# registries get tags and the client fails to load registries.
# registries_report = "path/to/generated/reports/registries.json"

# Optional: reports/blocks.json generated from your game copy with
# `tools\generate-reports.ps1`. When set, block state ids come from that
# report, which is required to encode chunk block palettes; when omitted
# chunk sections cannot be encoded (M3).
# blocks_report = "path/to/generated/reports/blocks.json"

# Optional: vanilla server 26.3 installation used by the ignored parity
# tests (crates/parity): an official server.jar from Mojang's version
# manifest and the directory it runs in (eula.txt, server.properties,
# per-run copies of the world template). The server itself ignores these.
# vanilla_server_jar = "path/to/server.jar"
# vanilla_server_dir = "path/to/vanilla"

# Placeholders — replace with the real values from your game installation.
protocol_version = 0
version_name = "unknown"
