# Example server configuration. Copy this file to `server.toml` (gitignored)
# and fill in the values from YOUR copy of the game: the protocol version
# number and version name live in `version.json` inside the client jar, and
# `client_jar` points at that same jar — registries and tags are read from
# `data/minecraft/` inside it at startup. See ARCHITECTURE.md section 5.
# Do not commit real values to the repository.

listen = "0.0.0.0:25565"
# Matches the vanilla `motd` (server.properties) so the status parity test
# compares like with like.
motd = "A Minecraft Server"
max_players = 20

# Chunks announced in Login (play): view distance = the largest radius the
# server sends (a client may ask for less in configuration, never for more),
# simulation distance = announced, nothing is simulated yet. 10/10 is both
# the vanilla `server.properties` default and what the parity test
# `login_fields` reads out of a real server's join.
view_distance = 10
simulation_distance = 10

# Region pool (M4.3): how many regions tick in parallel on their own threads.
# 0 disables the pool and ticks everything on the game thread. Absent means
# logical cores - 2 (at least 1). At most this many region threads exist; they
# are idle while fewer regions are loaded (M4.3 ticks the single region inline).
# workers = 4

# Region tile side in chunks (M4.3): the world is split into squares of this
# many chunks and each square is one region. 0 (the default) means no split:
# the whole world is region 0 and the server behaves exactly as before M4.3.
# The value is not decided yet (M4.6 benchmark); leave it at 0 unless testing
# the region grid.
# region_side = 0

# Path to the client jar of your game installation.
client_jar = "path/to/client.jar"

# REQUIRED at startup: reports/packets.json generated from your game copy
# with `tools\generate-reports.ps1`. Every packet id is taken from that
# report and verified at startup; the server stops with a clear error when
# the field is missing (a server without packet ids cannot be compared
# with the vanilla one).
# packets_report = "path/to/generated/reports/packets.json"

# REQUIRED at startup: reports/registries.json generated from your game
# copy with `tools\generate-reports.ps1`. The numeric ids of the built-in
# registries (block, item, potion, ...) come from that report and their
# tags are sent during configuration.
# registries_report = "path/to/generated/reports/registries.json"

# REQUIRED at startup: reports/blocks.json generated from your game copy
# with `tools\generate-reports.ps1`. Block state ids come from that
# report, which is required to encode chunk block palettes.
# blocks_report = "path/to/generated/reports/blocks.json"

# REQUIRED at startup: a saved world directory (M3): the folder that
# contains `level.dat` and `dimensions/minecraft/overworld/region/`. The
# server sends the ready chunks of that world on join; without this field
# the startup fails with an error instead of joining players into an empty
# void, where a vanilla client waits for terrain, times out after ~30 s and
# falls through the world.
# world_dir = "path/to/world-template"

# Optional: vanilla server 26.3 installation used by the ignored parity
# tests (crates/parity): an official server.jar from Mojang's version
# manifest and the directory it runs in (eula.txt, server.properties,
# per-run copies of the world template). The server itself ignores these.
# vanilla_server_jar = "path/to/server.jar"
# vanilla_server_dir = "path/to/vanilla"

# Placeholders — replace with the real values from your game installation.
protocol_version = 0
version_name = "unknown"
